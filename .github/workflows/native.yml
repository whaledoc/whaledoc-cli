name: Native build

# Reusable workflow: builds, smoke-tests and uploads the native executable for every platform.
# Called by build.yml (pull requests and main) and release.yml.

on:
  workflow_call:
    inputs:
      version:
        description: Version to build, e.g. 1.2.0. Empty keeps the version from pom.xml.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest supported Ubuntu so the binary links against an older glibc
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15
          - target: windows-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: ./mvnw -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build native executable
        shell: bash
        run: ./mvnw -B -Pnative package

      - name: Smoke test
        shell: bash
        run: |
          bin=target/whaledoc
          [ "$RUNNER_OS" = "Windows" ] && bin=target/whaledoc.exe

          expected="WhaleDoc version $(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          actual="$("$bin" --version | tr -d '\r')"
          echo "$actual"

          # An exact match also catches logback or reflection warnings printed at startup
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected '$expected' but got '$actual'"
            exit 1
          fi

          "$bin" --help
          "$bin" listen --help

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd target && 7z a -tzip "../dist/whaledoc-${{ matrix.target }}.zip" whaledoc.exe)
          else
            tar -czf "dist/whaledoc-${{ matrix.target }}.tar.gz" -C target whaledoc
          fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }

          # Quoted: PowerShell would otherwise split the argument at the dot
          $version = ./mvnw.cmd -B -q help:evaluate "-Dexpression=project.version" -DforceStdout
          $fileVersion = ($version -split '-')[0]
          & $iscc.FullName "/DAppVersion=$version" "/DFileVersion=$fileVersion" packaging\windows\whaledoc.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\whaledoc"

          Start-Process dist\whaledoc-setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          & "$dir\whaledoc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable does not run" }

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if ($userPath -notcontains $dir) { throw "Installer did not add $dir to PATH" }

          # The uninstaller relaunches itself from a temporary copy and returns early, so poll until it is done
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          $isUninstalled = {
              -not (Test-Path "$dir\whaledoc.exe") -and
              (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir)
          }
          for ($i = 0; $i -lt 30 -and -not (& $isUninstalled); $i++) { Start-Sleep -Seconds 1 }
          if (-not (& $isUninstalled)) { throw "Uninstaller did not remove whaledoc.exe and its PATH entry" }

          Write-Host "Installer installs, adds to PATH and uninstalls cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: whaledoc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
