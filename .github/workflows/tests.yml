name: Tests

# Pull requests run the tests on one Linux runner. The native executables for every platform are built
# only after merging (build.yml) and for releases (release.yml), since those runners cost far more.

on:
  pull_request:

permissions:
  contents: read

# A new push to the pull request cancels its run still in progress
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Compile and test
        run: ./mvnw -B verify
